name: careerpilot
services:
  mongodb:
    image: mongo:8.0
    ports:
      - "127.0.0.1:${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_LOCAL_PASSWORD:?Set NEO4J_LOCAL_PASSWORD in .env}"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 40s
    restart: unless-stopped
  backend:
    profiles: ["app"]
    build:
      context: ./backend
    environment:
      CP_APP_ENV: development
      CP_HOST: 0.0.0.0
      CP_PORT: 8000
      CP_LOG_LEVEL: ${CP_LOG_LEVEL:-INFO}
      CP_CORS_ORIGINS: ${CP_CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}
      CP_MONGODB_URI: mongodb://mongodb:27017
      CP_MONGODB_DATABASE: careerpilot_dev
      CP_NEO4J_URI: bolt://neo4j:7687
      CP_NEO4J_USER: neo4j
      CP_NEO4J_PASSWORD: ${NEO4J_LOCAL_PASSWORD:?Set NEO4J_LOCAL_PASSWORD in .env}
      CP_NEO4J_DATABASE: neo4j
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mongodb:
        condition: service_started
      neo4j:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=8)"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 30s
    init: true
    restart: unless-stopped
volumes:
  mongodb_data:
  neo4j_data:
